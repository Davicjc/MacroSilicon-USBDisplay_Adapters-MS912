# AMD (driver amdgpu): TearFree desligado.
# Com "auto", o amdgpu liga TearFree para saidas secundarias RandR 1.4
# (monitor USB ms912x via reverse PRIME) e recopia a tela inteira a cada
# quadro, mesmo parada. Nas saidas da propria AMD (nao giradas) "auto" ja
# equivale a "off", entao nada muda nelas. Ver: man amdgpu, Option "TearFree".
# OutputClass (e nao Device) para nao desligar a deteccao automatica das
# outras placas: com uma secao Device o Xorg ignora o adaptador USB no boot.
Section "OutputClass"
    Identifier  "AMDgpu TearFree off"
    MatchDriver "amdgpu"
    # Driver e obrigatorio: sem ele o Xorg poe um driver "(null)" na lista
    # automatica e para de carregar o modesetting (usado pelo adaptador USB).
    Driver      "amdgpu"
    Option      "TearFree" "off"
EndSection
